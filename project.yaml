project:
  id: homenas
  name: "HomeNas Operations"
  kanboard_project_id: 1
  columns:
    - "Backlog"
    - "Ready"
    - "In Progress"
    - "Waiting Review"
    - "Done"
  constraints:
    max_lines_per_file: 150
    max_retry_loops: 2
    max_active_downloads: 1

memory:
  user_profile: "./shared/memory/USER.md"
  max_dept_lines: 100

departments:
  director:
    swimlane: "Director / General"
    skills_dir: "./skills/director"
    allowed_tools: ["kanboard-client"]

  dept-nas-ops:
    swimlane: "NAS Ops"
    memory_file: "./memory/dept-nas-ops/MEMORY.md"
    skills_dir: "./skills/dept-nas-ops"
    allowed_tools: ["kanboard-client", "nas-inspector"]

  dept-media:
    swimlane: "Media & Download"
    memory_file: "./memory/dept-media/MEMORY.md"
    skills_dir: "./skills/dept-media"
    allowed_tools: ["kanboard-client", "media-inspector"]

  # Solo Tech Secretary for HomeNas (NOT a 11-agent product dev department; full dev teams live only in standalone projects)
  tech-secretary:
    kanboard_author: "dept-dev"
    display_name: "Liam (Tech Secretary)"
    swimlane: "Tech Secretary / Scripts"
    memory_file: "./memory/dept-dev/MEMORY.md"
    skills_dir: "./skills/dept-dev"
    allowed_tools: ["kanboard-client", "git", "pytest"]
