name: agy-platform

services:
  kanboard:
    image: kanboard/kanboard:latest
    container_name: kanboard
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./data/kanboard/data:/var/www/app/data
      - ./data/kanboard/plugins:/var/www/app/plugins
    networks:
      - agy-net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 1
      DELETE: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agy-net

  homenas-watchdog:
    build:
      context: ..
      dockerfile: platform/Dockerfile.watchdog
    container_name: homenas-watchdog
    restart: unless-stopped
    env_file:
      - .env
    privileged: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - /dev/disk/by-id:/dev/disk/by-id:ro
      - /mnt/disk1:/mnt/disk1
      - /mnt/disk2:/mnt/disk2
      - ../shared:/app/shared:ro
      - ../tools:/app/tools:ro
      - ../project.yaml:/app/project.yaml:ro
      - ./data/kanboard/data:/kanboard-data:ro
      - ../logs:/app/logs
    depends_on:
      - kanboard
      - docker-proxy
    networks:
      - agy-net
      - media-stack_default

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp
    profiles: ["dev-mcp"]
    restart: "no"
    command: ["--headless", "--port", "8931", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8931:8931"
    networks:
      - agy-net

networks:
  agy-net:
    name: agy-net
    driver: bridge
  media-stack_default:
    external: true
